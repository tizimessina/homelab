services:
  samba:
    image: ghcr.io/servercontainers/samba:a3.24.1-s4.23.8-r0   # Alpine 3.24.1 + Samba 4.23.8
    container_name: samba
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    # Formato lista para poder interpolar el nombre de usuario dentro del nombre de la variable.
    # WSDD2 queda habilitado por no definir WSDD2_DISABLE (la imagen lo desactiva si la variable
    # existe, sin importar su valor — ver Gotchas en el README).
    environment:
      - TZ=${TZ}
      - SAMBA_CONF_LOG_LEVEL=1
      - ACCOUNT_${SAMBA_USER}=${SAMBA_PASSWORD_HASH}
      - SAMBA_VOLUME_CONFIG_seagate=[Seagate]; path=/shares/seagate; valid users = ${SAMBA_USER}; guest ok = no; read only = no; browseable = yes
    volumes:
      - /mnt/disco-seagate:/shares/seagate
