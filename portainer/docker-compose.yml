services:
  portainer:
    image: portainer/portainer-ce:2.39.6
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"   # Web UI (HTTPS, self-signed por default)
      # 8000 (túnel de Edge Agents remotos) no se publica: no hay agentes remotos
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer-data:/data
