services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./sites:/etc/caddy/sites
      - ./caddy-data:/data
      - ./caddy-config:/config
    networks:
      - default
      - proxy

networks:
  # Red compartida con las apps que se proxean por nombre de contenedor
  # (creada una vez con `docker network create proxy`).
  proxy:
    external: true
